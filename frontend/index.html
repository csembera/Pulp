    function formatDate(iso) {
      if (!iso) return '';
      try { return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
      catch { return iso; }
    }

    function relativeTime(iso) {
      if (!iso) return '';
      const diffSec = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diffSec < 60)      return 'just now';
      if (diffSec < 3600)    { const m = Math.round(diffSec / 60);    return `${m} minute${m === 1 ? '' : 's'} ago`; }
      if (diffSec < 86400)   { const h = Math.round(diffSec / 3600);  return `${h} hour${h === 1 ? '' : 's'} ago`; }
      if (diffSec < 604800)  { const d = Math.round(diffSec / 86400); return `${d} day${d === 1 ? '' : 's'} ago`; }
      if (diffSec < 2629800) { const w = Math.round(diffSec / 604800); return `${w} week${w === 1 ? '' : 's'} ago`; }
      if (diffSec < 31557600){ const mo = Math.round(diffSec / 2629800); return `${mo} month${mo === 1 ? '' : 's'} ago`; }
      const y = Math.round(diffSec / 31557600);
      return `${y} year${y === 1 ? '' : 's'} ago`;
    }

    function scoreClass(score, total) {
      if (!total) return '';
      const pct = (score / total) * 100;
      if (pct >= 70) return 'pass';
      if (pct < 60) return 'fail';
      return '';
    }

    function formatDateTime(iso) {
      if (!iso) return '';
      try {
        return new Date(iso).toLocaleString(undefined, {
          month: 'short', day: 'numeric',
          hour: 'numeric', minute: '2-digit',
        });
      } catch { return iso; }
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildQuiz(bank, count) {
      return shuffle(bank).slice(0, count).map(q => {
        const order      = shuffle([0, 1, 2, 3]);
        const newOptions = order.map(i => q.options[i]);
        const newCorrect = order.indexOf(q.correctIndex);
        return { question: q.question, options: newOptions, correctIndex: newCorrect };
      });
    }

    function FlashCard({ term, definition }) {
      const [revealed, setRevealed] = useState(false);
      return html`
        <button
          type="button"
          class="term"
          aria-expanded=${revealed}
          onClick=${() => setRevealed(v => !v)}
        >
          <div class="term-head">
            <span class="term-name">${term}</span>
            <span class="term-hint" aria-hidden="true">${revealed ? 'Tap to hide' : 'Tap to reveal'}</span>
          </div>
          ${revealed ? html`<p class="term-def">${definition}</p>` : null}
        </button>
      `;
    }

    function QuizPlayer({ auth, topic, onExit }) {
      const [phase, setPhase]         = useState('config');
      const [length, setLength]       = useState(null);
      const [questions, setQuestions] = useState([]);
      const [answers, setAnswers]     = useState([]);
      const [current, setCurrent]     = useState(0);
      const [selected, setSelected]   = useState(null);
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore]         = useState(null);
      const [history, setHistory]     = useState([]);
      const [error, setError]         = useState(null);

      const start = (lengthChoice) => {
        const count = lengthChoice === 'short' ? 10 : lengthChoice === 'medium' ? 15 : 25;
        setLength(lengthChoice);
        setQuestions(buildQuiz(topic.quizQuestions, count));
        setAnswers([]);
        setCurrent(0);
        setSelected(null);
        setSubmitted(false);
        setScore(null);
        setError(null);
        setPhase('playing');
      };

      const advance = async () => {
        if (selected === null) return;
        const updated = [...answers, selected];
        setAnswers(updated);
        setSelected(null);
        setSubmitted(false);

        if (current + 1 < questions.length) {
          setCurrent(current + 1);
          return;
        }

        const finalScore = updated.reduce(
          (acc, ans, i) => acc + (ans === questions[i].correctIndex ? 1 : 0),
          0,
        );
        setScore(finalScore);
        setPhase('submitting');

        try {
          const postRes = await apiFetch(auth, `/topics/${topic.topicId}/attempts`, {
            method: 'POST',
            body:   JSON.stringify({ length, score: finalScore, total: questions.length }),
          });
          if (!postRes.ok) {
            setError(`Could not save attempt (${postRes.status}). Score is shown below.`);
          }
        } catch (e) {
          setError(e.message || 'Could not save attempt. Score is shown below.');
        }

        try {
          const histRes = await apiFetch(auth, `/topics/${topic.topicId}/attempts`);
          if (histRes.ok) setHistory(await histRes.json());
        } catch { /* keep history empty */ }

        setPhase('results');
      };

      if (phase === 'config') {
        const bank = topic.quizQuestions?.length ?? 0;
        return html`
          <div class="screen">
            <button class="back" onClick=${onExit}>← ${topic.title || 'Topic'}</button>
            <h1 class="topic-title">Quiz</h1>
            <p class="topic-meta">Questions are picked at random from a ${bank}-question bank, the order changes every play.</p>
            <div class="actions">
              <button type="button" class="action" onClick=${() => start('short')}>
                <div class="action-title">Short: 10 questions</div>
                <div class="action-meta">Quick refresh</div>
              </button>
              <button type="button" class="action" onClick=${() => start('medium')}>
                <div class="action-title">Medium: 15 questions</div>
                <div class="action-meta">Standard set</div>
              </button>
              <button type="button" class="action" onClick=${() => start('long')}>
                <div class="action-title">Long: 25 questions</div>
                <div class="action-meta">Full knowledge test</div>
              </button>
            </div>
          </div>
        `;
      }

      if (phase === 'playing') {
        const q           = questions[current];
        const isLast      = current === questions.length - 1;
        const hasSelected = selected !== null;
        const wasCorrect  = submitted && selected === q.correctIndex;

        return html`
          <div class="screen">
            <button class="back" onClick=${onExit}>← ${topic.title || 'Topic'}</button>
            <p class="topic-meta">Question ${current + 1} of ${questions.length}</p>
            <h2 class="quiz-question">${q.question}</h2>
            <div class="options">
              ${q.options.map((opt, i) => {
                const isSelected = selected === i;
                const isCorrect  = i === q.correctIndex;
                let cls  = 'option';
                let mark = null;
                if (submitted) {
                  cls += ' locked';
                  if (isSelected && isCorrect)            { cls += ' correct'; mark = '✓'; }
                  else if (isSelected && !isCorrect)      { cls += ' wrong';   mark = '✕'; }
                  else if (!wasCorrect && isCorrect)      { cls += ' correct'; mark = '✓'; }
                  else                                    { cls += ' muted'; }
                } else if (isSelected) {
                  cls += ' selected';
                }
                return html`
                  <button type="button" key=${i} class=${cls}
                    onClick=${() => { if (!submitted) setSelected(i); }}>
                    ${opt}
                    ${mark && html`<span class="option-mark">${mark}</span>`}
                  </button>
                `;
              })}
            </div>
            ${submitted
              ? html`
                <button type="button" class="primary quiz-next" onClick=${advance}>
                  ${isLast ? 'Finish quiz' : 'Next question'}
                </button>
              `
              : html`
                <button type="button" class="primary quiz-next"
                  disabled=${!hasSelected}
                  onClick=${() => setSubmitted(true)}>
                  Submit
                </button>
              `}
          </div>
        `;
      }

      if (phase === 'submitting') {
        return html`<div class="loading">Saving your score…</div>`;
      }

      const pct = questions.length === 0 ? 0 : Math.round((score / questions.length) * 100);
      return html`
        <div class="screen">
          <button class="back" onClick=${onExit}>← ${topic.title || 'Topic'}</button>
          <p class="quiz-score">${score} / ${questions.length}</p>
          <p class="topic-meta">${pct}% · ${length} quiz</p>
          ${error && html`<div class="alert error">${error}</div>`}
          <div class="quiz-actions">
            <button type="button" class="btn" onClick=${() => start(length)}>Play again</button>
            <button type="button" class="btn secondary" onClick=${() => setPhase('config')}>Change length</button>
          </div>
          <h3>Your attempts</h3>
          ${history.length === 0
            ? html`<p class="muted">No saved attempts yet.</p>`
            : html`
              <ul class="history">
                ${history.map((h, i) => html`
                  <li class="history-item" key=${i}>
                    <span class="history-score ${scoreClass(h.score, h.total)}">${h.score} / ${h.total}</span>
                    <span class="history-meta">${h.length} · ${formatDateTime(h.timestamp)}</span>
                  </li>
                `)}
              </ul>
            `}
        </div>
      `;
    }

    // ── Landing (marketing page rendered at #/) ───────────────────────────

              inputmode="email"
              placeholder="your@email.com"
              value=${email}
              onInput=${(e) => setEmail(e.target.value)}
              disabled=${done || busy}
            />
          </div>
          <button type="submit" class=${`btn-join${done ? ' done' : ''}`} disabled=${done || busy}>
            <span>${done ? "You're on the list ✓" : 'Request my invite'}</span>
            ${done ? null : html`
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            `}
          </button>
        </form>
      `;
    }

    function Landing() {
      // Scroll-in animations for `.obs` sections (mirrors landing/pulp/index.html).
      useEffect(() => {
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add('in');
              obs.unobserve(e.target);
            }
          });
        }, { threshold: 0.12 });
        document.querySelectorAll('.landing-page .obs').forEach((el) => obs.observe(el));
        return () => obs.disconnect();
      }, []);

      return html`
        <main class="landing-page">
          <div class="wrap">
            <section class="hero">
              <h1 class="reveal d1">Learn<span class="it">on the go.</span></h1>
              <p class="lede reveal d2">
                Turn dense PDFs into customized summaries, key terms, and 25-question quizzes in under 
                a minute. Simply upload a technical paper, user guide, or set of lecture notes and let Pulp do the rest.
              </p>
              <div class="signup reveal d3">
                <div class="signup-head">
                  <h2 class="signup-title">Join the waitlist</h2>
                  <p class="signup-sub">Pulp is invite-only while we're in beta. Leave your email and we'll send an invite as soon as a spot opens.</p>
                </div>
                <${WaitlistForm} id="lp-email" />
              </div>
            </section>

            <section class="section obs">
              <span class="eyebrow">How it works</span>
              <h2>From PDF to <span class="it">study session</span>, in three steps.</h2>
              <div class="steps">
                <div class="step">
                  <div class="step-head">
                    <div class="step-num">1.</div>
                    <h3>Drop a PDF</h3>
                  </div>
                  <p>Upload up to 50 MB: a whitepaper, textbook chapter, or user guide. Anything you'd otherwise have to skim.</p>
                </div>
                <div class="step">
                  <div class="step-head">
                    <div class="step-num">2.</div>
                    <h3>Pulp does the work</h3>
                  </div>
                  <p>It reads the whole thing, pulls out a structured summary, the key terms that matter, and writes a quiz to test you.</p>
                </div>
                <div class="step">
                  <div class="step-head">
                    <div class="step-num">3.</div>
                    <h3>Actually study</h3>
                  </div>
                  <p>Review, take the quiz, track your scores. Everything's saved to your library so you can come back and resume.</p>
                </div>
              </div>
            </section>

            <section class="section obs">
              <span class="eyebrow">Your library</span>
              <h2>Track your <span class="it">progress.</span></h2>
              <div class="lib-preview">
                <div class="lib-head">
                  <span class="t">Your library</span>
                </div>
                <div class="lib-topics">
                  <div class="step">
                    <h3>Claude Platform on AWS User Guide</h3>
                    <p>7 sections · 18 key terms</p>
                    <div class="step-actions">
                      <button class="btn" type="button">Quiz</button>
                      <span class="recent-attempt pass">
                        <span class="label">Last attempt</span>
                        <span class="score">22 / 25</span>
                      </span>
                    </div>
                  </div>
                  <div class="step">
                    <h3>Inputs and Outputs of the Krebs Cycle</h3>
                    <p>4 sections · 9 key terms</p>
                    <div class="step-actions">
                      <button class="btn" type="button">Quiz</button>
                      <span class="recent-attempt fail">
                        <span class="label">Last attempt</span>
                        <span class="score">5 / 10</span>
                      </span>
                    </div>
                  </div>
                  <div class="step upload" aria-label="Upload a PDF">
                    <div class="upload-mark" aria-hidden="true">+</div>
                    <h3>Upload a PDF</h3>
                    <p>(Whitepaper, User guide, Lecture notes, Research paper, etc.)</p>
                  </div>
                </div>
              </div>
            </section>

            <footer class="lp-footer">
              <span class="fb">Pulp</span>
              <span class="fc">© Semba Solutions</span>
            </footer>
          </div>
        </main>
      `;
    }

    function emailInitials(email) {
      if (!email) return '?';
      const local = email.split('@')[0] || '';
      const parts = local.split(/[^a-zA-Z]+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      const first = parts[0] || local;
      return (first.slice(0, 2) || '?').toUpperCase();
    }

    function AccountMenu({ auth }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      const email = auth.user?.email || '';
      const initials = emailInitials(email);

      useEffect(() => {
        if (!open) return;
        const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        const onKey  = (e) => { if (e.key === 'Escape') setOpen(false); };
        document.addEventListener('mousedown', onDown);
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('mousedown', onDown);
          document.removeEventListener('keydown', onKey);
        };
      }, [open]);

      return html`
        <div class="account" ref=${ref}>
          <button
            type="button"
            class="avatar-btn"
            aria-label="Account"
            aria-haspopup="menu"
            aria-expanded=${open}
            onClick=${() => setOpen(v => !v)}
          >${initials}</button>
          ${open && html`
            <div class="account-menu" role="menu">
              <div class="head">
                <span class="head-label">Signed in as</span>
                <span class="head-email" title=${email}>${email}</span>
              </div>
              <div class="divider"></div>
              <button
                type="button"
                role="menuitem"
                class="signout-cta"
                onClick=${() => { setOpen(false); auth.signOut(); }}
              >Sign out</button>
            </div>
          `}
        </div>
      `;
    }

    // ── App shell ─────────────────────────────────────────────────────────
    function App() {
      const auth  = useAuth();
      const route = useHashRoute();

      useEffect(() => {
        if (auth.status === 'loading') return;
        if (auth.status === 'signed-out' && !PUBLIC_ROUTES.has(route)) {
          navigate('#/login');
        } else if (auth.status === 'signed-in' && PUBLIC_ROUTES.has(route)) {
          navigate('#/library');
        }
      }, [auth.status, route]);

      const screen = useMemo(() => {
        if (auth.status === 'loading') return html`<div class="loading">Loading…</div>`;
        if (auth.status === 'signed-out') {
          if (route === '#/' || route === '') return html`<${Landing} />`;
          if (route === '#/request-invite') return html`<${RequestInviteScreen} />`;
          if (route === '#/forgot-password') return html`<${ForgotPasswordScreen} auth=${auth} />`;
          // Default for any other route while signed-out: render Login so the
          // in-flight redirect to '#/login' doesn't flash a landing page.
          return html`<${LoginScreen} auth=${auth} />`;
        }
        const processingMatch = route.match(/^#\/processing\/([^/]+)$/);
        if (processingMatch) return html`<${ProcessingScreen} auth=${auth} jobId=${processingMatch[1]} />`;
        const topicMatch = route.match(/^#\/topic\/([^/]+)$/);
        if (topicMatch) return html`<${TopicScreen} auth=${auth} topicId=${topicMatch[1]} />`;
        return html`<${LibraryScreen} auth=${auth} />`;
      }, [auth, route]);

      return html`
        <div class="app">
          <nav class="nav">
            <a class="nav-brand" href=${auth.status === 'signed-in' ? '#/library' : '#/'}>
              <span class="nav-brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 2 C12 2 4 13.5 4 21 C4 26.5 7.6 30 12 30 C16.4 30 20 26.5 20 21 C20 13.5 12 2 12 2 Z" fill="#7fe3ee" />
                  <ellipse cx="8.2" cy="24" rx="1.4" ry="3.2" fill="#ffffff" opacity=".7" transform="rotate(-18 8.2 24)" />
                </svg>
              </span>
              Pulp
            </a>
            <div>
              ${auth.status === 'signed-in'
                ? html`<${AccountMenu} auth=${auth} />`
                : auth.status === 'signed-out' && route !== '#/login'
                  ? html`<a class="btn" href="#/login">Sign in</a>`
                  : null}
            </div>
          </nav>
          ${screen}
        </div>
      `;
    }

    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { console.error('Unhandled render error', error, info); }
      render() {
        if (!this.state.error) return this.props.children;
        return html`
          <div class="app">
            <nav class="nav">
              <a class="nav-brand" href="#/">
                <span class="nav-brand-mark" aria-hidden="true">
                  <svg viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2 C12 2 4 13.5 4 21 C4 26.5 7.6 30 12 30 C16.4 30 20 26.5 20 21 C20 13.5 12 2 12 2 Z" fill="#7fe3ee" />
                    <ellipse cx="8.2" cy="24" rx="1.4" ry="3.2" fill="#ffffff" opacity=".7" transform="rotate(-18 8.2 24)" />
                  </svg>
                </span>
                Pulp
              </a>
            </nav>
            <div class="screen">
              <div class="card">
                <h2>Something went wrong</h2>
                <div class="alert error">
                  The app hit an unexpected error and needs to reload.
                </div>
                <button type="button" class="primary" onClick=${() => location.reload()}>
                  Reload
                </button>
              </div>
            </div>
          </div>
        `;
      }
    }

    render(html`<${ErrorBoundary}><${App} /><//>`, document.getElementById('root'));
  </script>
</body>
</html>
